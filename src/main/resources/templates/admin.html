<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Панель администратора</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{header :: header}"></div>
<div class="container">
    <h1 class="mt-5">Панель администратора</h1>
    <h2 class="mt-4">Зарегистрированные сметчики</h2>
    <div th:if="${estimators.isEmpty()}">
        <p>Нет зарегистрированных сметчиков.</p>
    </div>
    <div th:each="estimator : ${estimators}" class="mt-4">
        <h3 th:text="${estimator.username}">Имя сметчика</h3>
        <div th:if="${estimator.estimateGroups.isEmpty()}">
            <p>У этого сметчика нет сохраненных смет.</p>
        </div>
        <div th:each="group : ${estimator.estimateGroups}" class="mt-3">
            <h5 th:text="${group.name}">Название сметы</h5>
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>Работа</th>
                    <th>Количество</th>
                    <th>Коэффициент</th>
                    <th>Общая стоимость</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="estimate : ${group.estimates}">
                    <td th:text="${estimate.work.name}"></td>
                    <td th:text="${estimate.quantity}"></td>
                    <td th:text="${estimate.coefficient}"></td>
                    <td th:text="${#numbers.formatDecimal(estimate.totalCost, 1, 2)}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
